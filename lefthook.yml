# Lefthook configuration for the Weld engine.
# See https://lefthook.dev/configuration/ for the reference.
# Spec: briefs/S0-bootstrap.md, "lefthook.yml specification".
# M0.0: `commit-msg` now invokes the Zig linter (`zig build lint-commit`)
# instead of the shell-script fallback, and `pre-commit` adds a
# `zig build lint` pass alongside `zig fmt --check`.
# M0.3: `pre-push` adds a TSan rerun of the Wayland stress test
# (Linux-only compensation for the absent TSan path in the CI matrix).

pre-commit:
  parallel: true
  commands:
    zig-fmt:
      glob: "*.zig"
      run: zig fmt --check {staged_files}
    weld-lint:
      run: zig build lint

commit-msg:
  commands:
    conventional-commits:
      run: zig build lint-commit -- {1}

pre-push:
  piped: true
  commands:
    build:
      run: zig build
    # --test-timeout is the only per-test deadline: without it a hung test
    # hangs the push.
    test:
      run: zig build test --test-timeout 180s
    test-release:
      run: zig build test -Doptimize=ReleaseSafe --test-timeout 180s
    # The Wayland stress test under ThreadSanitizer, which the CI matrix does
    # not run; Linux only, the test itself being skipped elsewhere.
    test-tsan-wayland:
      run: |
        if [ "$(uname -s)" = "Linux" ]; then
          zig build test-tsan-wayland --test-timeout 180s
        else
          true
        fi
