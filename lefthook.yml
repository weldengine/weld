pre-commit:
  parallel: true
  commands:
    zig-fmt:
      glob: "*.zig"
      run: zig fmt --check {staged_files}
    weld-lint:
      run: zig build lint

commit-msg:
  commands:
    conventional-commits:
      run: zig build lint-commit -- {1}

pre-push:
  piped: true
  commands:
    build:
      run: zig build
    test:
      run: zig build test --test-timeout 180s
    test-release:
      run: zig build test -Doptimize=ReleaseSafe --test-timeout 180s
    # The Wayland stress test under ThreadSanitizer, which the CI matrix does
    # not run; Linux only, the test itself being skipped elsewhere.
    test-tsan-wayland:
      run: |
        if [ "$(uname -s)" = "Linux" ]; then
          zig build test-tsan-wayland --test-timeout 180s
        else
          true
        fi
