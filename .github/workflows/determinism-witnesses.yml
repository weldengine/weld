name: Determinism witnesses

# M1.1.14 — generation of the committed determinism witnesses.
#
# WHY A DEDICATED, MANUALLY TRIGGERED WORKFLOW. A witness is the artifact that
# pins a result in time; producing it must therefore be a DECLARED ACT with a
# verifiable provenance, never a side effect of a red cell. This workflow gives
# both: it runs only on `workflow_dispatch`, it REQUIRES a written reason, and
# the run it produces has a URL that goes into the body of the commit that adds
# the binaries. Provenance stops being an assertion and becomes a link.
#
# WHY IT CANNOT BE GENERATED ON A DEVELOPER MACHINE. The primary development
# machine is Apple Silicon; a `continuous-chain-f32-Debug.bin` fabricated there
# for an x86_64 chain would be a witness with no provenance at all, which is
# exactly what `engine-platform.md` §8 refuses.
#
# WHY LINUX, AND THE CONSEQUENCE IS INTENDED. Generating on `ubuntu-24.04` makes
# Linux the reference BY CONSTRUCTION and Windows the verifier. If a Windows cell
# then diverges, that divergence is THE MEASUREMENT of the milestone and not an
# incident to absorb. Regenerating on Windows to make a Windows divergence pass
# is NAMED AND FORBIDDEN: it is the silently re-baselined witness, and it is the
# one act that destroys everything the witnesses are for.
#
# NO AGGREGATOR JOB AND NO `actions/download-artifact`. The artifact is collected
# with `gh run download`, which is a CLI call and not a workflow action, so the
# §7.3 whitelist is not extended (`engine-development-workflow.md` §7.3 records
# the refusal and its motive). Every verifying cell compares against the
# committed tree and fails alone.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why these witnesses are being (re)generated — goes in the commit body"
        required: true
        type: string

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  # The same pinning the verifying cells use. A witness generated for a different
  # CPU feature set than the one that will check it is not a witness
  # (`ARCH-031` rule 6).
  ZIG_CPU: "baseline"

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Declare the motive
        run: echo "reason=${{ inputs.reason }}"

      - name: Generate one witness set per (precision, mode)
        shell: bash
        run: |
          set -euo pipefail
          for prec in false true; do
            for mode in Debug ReleaseSafe; do
              tag=$([ "$prec" = "true" ] && echo f64 || echo f32)
              dir="out/$tag-$mode"
              mkdir -p "$dir"
              echo "=== $tag / $mode ==="
              zig build forge-determinism \
                -Doptimize=$mode -Dphysics_f64=$prec -Dcpu=${{ env.ZIG_CPU }} \
                -- --write-witness "$dir"
            done
          done

      # The two mode-independent witness kinds are keyed by PRECISION ALONE, which
      # asserts that Debug and ReleaseSafe agree on them. That is a hypothesis, so
      # it is CHECKED here rather than assumed by the file name: the two modes'
      # copies must be byte-identical before either is published. If they are not,
      # generation FAILS — and that failure is a finding about level 1, not a
      # packaging problem to work around.
      - name: Assert the mode-independent artifacts agree across modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p witnesses
          for tag in f32 f64; do
            for kind in discrete reference-window; do
              a="out/$tag-Debug/$kind-$tag.bin"
              b="out/$tag-ReleaseSafe/$kind-$tag.bin"
              if ! cmp -s "$a" "$b"; then
                echo "::error::$kind-$tag.bin differs between Debug and ReleaseSafe."
                echo "::error::Its witness key carries precision only, so the two modes must agree."
                echo "::error::This is a level-1 finding, not a packaging issue. Do not paper over it."
                cmp "$a" "$b" || true
                exit 1
              fi
              cp "$a" "witnesses/$kind-$tag.bin"
              echo "$kind-$tag.bin: Debug == ReleaseSafe ($(stat -c%s "$a") B)"
            done
            for mode in Debug ReleaseSafe; do
              cp "out/$tag-$mode/continuous-chain-$tag-$mode.bin" "witnesses/"
            done
          done
          echo "--- witness set ---"
          ls -l witnesses/
          sha256sum witnesses/* | tee witnesses/SHA256SUMS.txt

      - name: Upload the witness set
        uses: actions/upload-artifact@v6
        with:
          name: determinism-witnesses
          path: witnesses/
          retention-days: 90
