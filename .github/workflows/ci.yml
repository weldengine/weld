name: CI

# Design and dimensioning live in engine-platform.md § CI du dépôt moteur (normatif).
# Any change of design goes to that document first; this file is the program.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  ZIG_CPU: "baseline"
  ZIG_CACHE_CAP: "10737418240"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      reason: ${{ steps.detect.outputs.reason }}
      week: ${{ steps.week.outputs.week }}
    steps:
      - name: Compute the lineage window
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Decide whether this tree needs a run
        id: detect
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zig run tools/ci_verdict/main.zig -- decide --event "$EVENT" --base "$BASE" --head "$HEAD" \
            --tested HEAD --repo "${{ github.repository }}" --check ci-gate >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, ubuntu-24.04-arm]
        mode: [Debug, ReleaseSafe]
        precision: [false, true]
        include:
          - os: ubuntu-24.04
            mode: ReleaseFast
            precision: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (matrix.mode == 'ReleaseSafe' || matrix.mode == 'ReleaseFast') && 75 || 35 }}
    steps:
      - uses: actions/checkout@v6

      # Action versions pinned to the engine-development-workflow.md §7.3
      # whitelist: weldengine/setup-zig@v0.1.0 (exact
      # tag, not a floating @v0 — manual bumps), actions/cache@v5,
      # actions/upload-artifact@v6, actions/checkout@v6. All Node 24 /
      # runner ≥ 2.327.1.
      # Brief specifies `version: 0.16.x` for patch fluidity, but the
      # setup-zig action takes that syntax literally and resolves to
      # zig-...-0.16.x.tar.xz on the mirrors (404 everywhere). Pinned to
      # 0.16.0 exact until the action supports semver ranges or we switch
      # to `version-file: build.zig.zon`. The build.zig minor-version guard still
      # enforces the 0.16.x invariant on the local toolchain.
      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}
          # use-cache: false — the action caches .zig-cache itself; this workflow owns it
          use-cache: false

      # §7.3 whitelist note: actions/cache/restore@v5 and actions/cache/save@v5
      # are sub-actions of the already-whitelisted actions/cache@v5 (same
      # repo, same major, same portability notes).
      - name: Restore Zig cache
        id: zig-cache
        if: matrix.mode != 'Debug'
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: zig-v2-${{ needs.changes.outputs.week }}-${{ matrix.os }}-${{ matrix.mode }}-f64_${{ matrix.precision }}-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ needs.changes.outputs.week }}-${{ matrix.os }}-${{ matrix.mode }}-f64_${{ matrix.precision }}-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-
            zig-v2-${{ needs.changes.outputs.week }}-${{ matrix.os }}-${{ matrix.mode }}-f64_${{ matrix.precision }}-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-

      - name: zig fmt --check
        run: zig fmt --check src tests build.zig

      - name: zig build
        shell: bash
        run: |
          set -euo pipefail
          s=$SECONDS
          zig build -Doptimize=${{ matrix.mode }} -Dphysics_f64=${{ matrix.precision }} -Dcpu=${{ env.ZIG_CPU }}
          echo "BUILD_SECONDS=$((SECONDS - s))" >> "$GITHUB_ENV"

      - name: zig build test
        shell: bash
        run: |
          set -euo pipefail
          s=$SECONDS
          # --test-timeout raises Zig's 60 s response floor: on windows a compiler spawned beside a
          # test can inherit its pipe and hold the end of stream until that compiler exits.
          zig build test --summary all --test-timeout 180s -Doptimize=${{ matrix.mode }} -Dphysics_f64=${{ matrix.precision }} -Dcpu=${{ env.ZIG_CPU }} 2>&1 | tee test-out.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          collected="$(sed -n 's/.*[0-9][0-9]* of \([0-9][0-9]*\) tests passed.*/\1/p;s#.*[^0-9]\([0-9][0-9]*\)/\([0-9][0-9]*\) tests passed.*#\2#p' test-out.txt | tail -1)"
          if ! printf '%s' "$collected" | grep -Eq '^[0-9]+$'; then
            echo "::error::could not read the collected test total from the suite summary"
            grep -n "tests passed" test-out.txt || true
            exit 1
          fi
          echo "COLLECTED_TESTS=$collected" >> "$GITHUB_ENV"
          echo "suite reported $collected collected tests"
          echo "TEST_SECONDS=$((SECONDS - s))" >> "$GITHUB_ENV"

      - name: zig build test-etch
        run: zig build test-etch -Doptimize=${{ matrix.mode }} -Dphysics_f64=${{ matrix.precision }} -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build bindgen-verify
        run: zig build bindgen-verify -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build bindgen-check
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build bindgen-check -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build bindgen-check (f64)
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build bindgen-check -Dphysics_f64=true -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build verify-synth-100
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build verify-synth-100 -Dphysics_f64=${{ matrix.precision }} -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build forge-asm-inventory
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build forge-asm-inventory -Dphysics_f64=${{ matrix.precision }} -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build lint
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build lint -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build ecs-access-counterproof
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build ecs-access-counterproof -Dphysics_f64=${{ matrix.precision }} -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build ecs-access-zero-cost
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build ecs-access-zero-cost -Dcpu=${{ env.ZIG_CPU }}

      - name: zig build c-api-read-column-constness
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build c-api-read-column-constness -Dcpu=${{ env.ZIG_CPU }}

      - name: dead-test conservation against the suite's own total
        shell: bash
        run: zig build dead-tests -Dcpu=${{ env.ZIG_CPU }} -Dexpect-collected=${{ env.COLLECTED_TESTS }}

      - name: zig build forge-determinism
        run: zig build forge-determinism -Doptimize=${{ matrix.mode }} -Dphysics_f64=${{ matrix.precision }} -Dcpu=${{ env.ZIG_CPU }}

      - name: Write CI timing report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="ci-timing-${{ matrix.os }}-${{ matrix.mode }}-f64_${{ matrix.precision }}.txt"
          {
            echo "cell=build-and-test (${{ matrix.os }}, ${{ matrix.mode }}, ${{ matrix.precision }})"
            echo "os=${{ matrix.os }}"
            echo "mode=${{ matrix.mode }}"
            echo "physics_f64=${{ matrix.precision }}"
            echo "zig_version=${{ env.ZIG_VERSION }}"
            echo "cache_enabled=true"
            echo "cache_bytes=$(du -sk .zig-cache 2>/dev/null | cut -f1 | awk '{print $1*1024}')"
            echo "cache_hit=${{ steps.zig-cache.outputs.cache-hit || 'false' }}"
            echo "cache_matched_key=${{ steps.zig-cache.outputs.cache-matched-key || 'none' }}"
            echo "build_seconds=${BUILD_SECONDS:-NA}"
            echo "test_seconds=${TEST_SECONDS:-NA}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "sha=${{ github.sha }}"
          } > "$report"
          cat "$report"

      - name: Upload CI timing artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-${{ matrix.os }}-${{ matrix.mode }}-f64_${{ matrix.precision }}
          path: ci-timing-${{ matrix.os }}-${{ matrix.mode }}-f64_${{ matrix.precision }}.txt
          retention-days: 30

      - name: Measure the Zig cache before the final save
        if: always()
        id: cache-size-final
        shell: bash
        run: |
          set -euo pipefail
          limit="$ZIG_CACHE_CAP"
          bytes=$(du -sk .zig-cache 2>/dev/null | cut -f1 || echo 0)
          bytes=$((bytes * 1024))
          echo "zig cache (final): $bytes bytes (cap $limit)"
          echo "--- composition ---"
          du -sk .zig-cache/* 2>/dev/null | sort -rn | head -10 || true
          if [ "$bytes" -gt "$limit" ]; then
            echo "::warning::Zig cache is $bytes bytes, over the $limit cap — SKIPPING the final save."
            echo "save=false" >> "$GITHUB_OUTPUT"
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Zig cache (final)
        if: always()
          && matrix.mode != 'Debug'
          && github.event_name == 'push'
          && steps.cache-size-final.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: zig-v2-${{ needs.changes.outputs.week }}-${{ matrix.os }}-${{ matrix.mode }}-f64_${{ matrix.precision }}-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}

  runtime-smoke-test:
    # Linux-only: weston + lavapipe provide a fully software path. Windows CI sits
    # behind manual GPU §4.5.1 validation since the runners do not ship a Vulkan
    # software driver.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, build-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}
          # use-cache: false — the action caches .zig-cache itself; this workflow owns it
          use-cache: false

      - name: Restore Zig cache
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: zig-v2-${{ needs.changes.outputs.week }}-${{ github.job }}-ubuntu-24.04-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ needs.changes.outputs.week }}-${{ github.job }}-ubuntu-24.04-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-

      - name: Install weston + Mesa Vulkan software drivers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston \
            mesa-vulkan-drivers \
            libvulkan1 \
            libwayland-client0 \
            libwayland-cursor0 \
            glslc

      - name: Locate lavapipe ICD on the runner
        run: |
          set -euo pipefail
          echo "--- find /usr/share/vulkan ---"
          find /usr/share/vulkan -name "*lvp*" -o -name "*lavapipe*" 2>/dev/null || echo "no lavapipe ICD found"
          echo "--- ls /usr/share/vulkan/icd.d/ ---"
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || echo "no icd.d directory"
          echo "--- dpkg -L mesa-vulkan-drivers | grep icd ---"
          dpkg -L mesa-vulkan-drivers | grep -i icd 2>/dev/null || echo "no icd in mesa-vulkan-drivers"
          echo "--- vulkaninfo --summary (if available) ---"
          (command -v vulkaninfo >/dev/null && vulkaninfo --summary 2>&1 | head -40) || echo "vulkaninfo not installed"

      - name: zig build (ReleaseSafe)
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseSafe -Dcpu=${{ env.ZIG_CPU }}

      - name: Launch weston headless backend
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-dir
          chmod 700 /tmp/runtime-dir
          XDG_RUNTIME_DIR=/tmp/runtime-dir WAYLAND_DISPLAY=wayland-1 \
            weston --backend=headless --width=1280 --height=720 &
          # Give weston a beat to bind the wayland socket before the
          # example connects.
          sleep 2
          echo "WAYLAND_DISPLAY=wayland-1" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp/runtime-dir" >> "$GITHUB_ENV"

      - name: zig build run-example-triangle (smoke + capture)
        env:
          # Force lavapipe (Mesa software Vulkan ICD) on the runner.
          # Path validated by the `Locate lavapipe ICD` diagnostic step
          # above — adjust here if the runner reports a different path.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -euo pipefail
          zig build run-example-triangle -Dcpu=${{ env.ZIG_CPU }} -- \
            --smoke-test --vulkan-driver=software --capture-frame=10

      - name: Verify PSNR vs golden
        run: |
          set -euo pipefail
          zig build test-ppm-psnr -Doptimize=ReleaseSafe -Dcpu=${{ env.ZIG_CPU }} --summary all 2>&1 | tee test-output.txt

      - name: zig build test-runtime-env
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -euo pipefail
          zig build test-runtime-env -Dcpu=${{ env.ZIG_CPU }} --summary all

      - name: Measure the Zig cache before the save
        if: always()
        id: cache-size
        shell: bash
        run: |
          set -euo pipefail
          limit="$ZIG_CACHE_CAP"
          bytes=$(du -sk .zig-cache 2>/dev/null | cut -f1 || echo 0)
          bytes=$((bytes * 1024))
          echo "zig cache: $bytes bytes (cap $limit)"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::warning::Zig cache is $bytes bytes, over the $limit cap — SKIPPING the save."
            echo "save=false" >> "$GITHUB_OUTPUT"
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Zig cache
        if: always() && github.event_name == 'push' && steps.cache-size.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: zig-v2-${{ needs.changes.outputs.week }}-${{ github.job }}-ubuntu-24.04-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-smoke-test-capture
          path: |
            examples/triangle/out/smoke_test.ppm
            test-output.txt
          retention-days: 30

  vertical-slice-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, build-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}
          # use-cache: false — the action caches .zig-cache itself; a Debug job stays cold
          use-cache: false

      - name: Install Mesa Vulkan (lavapipe) + validation layers + weston
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 weston
          # Ubuntu 24.04 names the Khronos validation layers package
          # `vulkan-validationlayers` (no hyphen); older naming used
          # `vulkan-validation-layers`. Try both — fail if neither installs
          # (validation MUST be active for this job to mean anything).
          sudo apt-get install -y --no-install-recommends vulkan-validationlayers \
            || sudo apt-get install -y --no-install-recommends vulkan-validation-layers
          ls /usr/share/vulkan/explicit_layer.d/ | grep -iq validation \
            || { echo "::error::Khronos validation layer manifest not found after install"; exit 1; }

      - name: Run vertical-slice smoke (Debug, validation layers active)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          # The loader then logs each layer it inserts: without that line, an
          # absent VUID says nothing about validation.
          VK_LOADER_DEBUG: layer
        run: |
          set -euo pipefail
          mkdir -p out
          zig build run-vertical-slice -Dcpu=${{ env.ZIG_CPU }} -- --smoke-test --capture out/vertical_slice.ppm 2>&1 | tee slice-smoke.log
          grep -qE 'Insert instance layer.*VK_LAYER_KHRONOS_validation' slice-smoke.log \
            || { echo "::error::the validation layer was not loaded — no validation verdict is implied"; exit 1; }
          echo "--- a frame was composed + captured ---"
          test -s out/vertical_slice.ppm
          echo "--- validation-clean (no Vulkan VUID / Validation Error) ---"
          if grep -E "VUID-|Validation Error" slice-smoke.log; then
            echo "::error::Vulkan validation error during the vertical-slice smoke (see log above)"
            exit 1
          fi
          echo "vertical-slice smoke OK: frame composed, validation clean."

      - name: Run vertical-slice C0.8 IPC edit (Debug, validation layers active)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_DEBUG: layer
        run: |
          set -euo pipefail
          mkdir -p out
          zig build run-vertical-slice -Dcpu=${{ env.ZIG_CPU }} -- --ipc-edit --capture out/vertical_slice_ipc.ppm 2>&1 | tee slice-c08.log
          grep -qE 'Insert instance layer.*VK_LAYER_KHRONOS_validation' slice-c08.log \
            || { echo "::error::the validation layer was not loaded — no validation verdict is implied"; exit 1; }
          echo "--- the post-edit frame composed + captured ---"
          test -s out/vertical_slice_ipc.ppm
          if grep -E "VUID-|Validation Error" slice-c08.log; then
            echo "::error::Vulkan validation error during the C0.8 IPC edit (see log above)"
            exit 1
          fi
          echo "vertical-slice C0.8 OK: IPC edit -> live world -> frame composed, validation clean."

      - name: Assert vk_blit GAL blit is validation-clean (E6 — colorspace VUID absent)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          VK_LOADER_DEBUG: layer
        run: |
          set -uo pipefail
          mkdir -p /tmp/weld-rt && chmod 700 /tmp/weld-rt
          XDG_RUNTIME_DIR=/tmp/weld-rt weston --backend=headless --width=1280 --height=720 &
          sleep 2
          export XDG_RUNTIME_DIR=/tmp/weld-rt WAYLAND_DISPLAY=wayland-1
          rc=0
          zig build run-ipc-demo -Dcpu=${{ env.ZIG_CPU }} -- --frames=120 > vkblit.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] || ! grep -q "ipc demo completed cleanly" vkblit.log; then
            tail -n 60 vkblit.log
            echo "::error::the ipc demo did not complete (exit $rc) — no validation verdict is implied"
            exit 1
          fi
          grep -qE 'Insert instance layer.*VK_LAYER_KHRONOS_validation' vkblit.log \
            || { echo "::error::the validation layer was not loaded — no validation verdict is implied"; exit 1; }
          echo "=== vk_blit GAL blit on lavapipe (E6) ==="
          echo "--- distinct VUIDs ---"
          grep -oE "VUID-[A-Za-z0-9-]+" vkblit.log | sort -u || echo "  (none)"
          echo "--- (a) colorspace — MUST be absent (E6 fix) ---"
          if grep -iE "imageColorSpace|color.?space|VUID-VkSwapchainCreateInfoKHR-imageColorSpace" vkblit.log; then
            echo "::error::E6 regression — vk_blit swapchain colorspace VUID still fires (bug (a) not resorbed)"
            exit 1
          fi
          echo "  absent — bug (a) resorbed."
          echo "--- sync-validation WRITE_AFTER_READ hazard — MUST be absent (render-pass external dependency) ---"
          if grep -E "SYNC-HAZARD" vkblit.log; then
            echo "::error::E6 regression — render-pass/acquire SYNC-HAZARD fires (GAL render-pass external subpass dependency missing)"
            exit 1
          fi
          echo "  absent — the GAL render-pass external subpass dependency holds under syncval."
          echo "--- (b) present-semaphore reuse (VUID-...-00067) — hardware-only, observed only ---"
          # NON-failing: software present on lavapipe is synchronous, so 00067
          # does not surface here; the per-image-semaphore fix is verified by
          # construction + hardware (no false green from a lavapipe pass).
          grep -E "00067|pSignalSemaphores" vkblit.log || echo "  not observed on lavapipe (expected — hardware-only)"
          echo "=== end E6 blit validation ==="

      - name: Upload slice capture
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vertical-slice-smoke-capture
          path: |
            out/vertical_slice.ppm
            out/vertical_slice_ipc.ppm
            slice-smoke.log
            slice-c08.log
            vkblit.log
          retention-days: 30

  witness-generation:
    # Gated by a commit trailer, not a workflow_dispatch workflow of its own: GitHub
    # requires a dispatchable workflow to exist on the DEFAULT branch before it can
    # be dispatched at all, whatever `--ref` says — measured, HTTP 404.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # CHECK OUT THE PR HEAD COMMIT ITSELF, not the synthetic merge commit.
      # MEASURED, and it took a live run to see it: on a `pull_request` event
      # `actions/checkout` defaults to `refs/pull/N/merge`, whose message is
      # `Merge <head> into <base>` — so `git log -1 --pretty=%B` read GitHub's
      # generated text and never the commit the author wrote. The trailer gate
      # could not fire, and it failed the way that costs the most: SILENTLY, by
      # skipping, on a green job.
      #
      # The second consequence is worse and would have SHIPPED: `github.sha` is
      # that same merge commit, an ephemeral object outside the branch history
      # that nobody can resolve later — so `PROVENANCE.txt`, whose entire purpose
      # is provenance, would have named a sha no reader could check out. Pinning
      # the head sha fixes both, and it is the right tree to generate from
      # anyway: a witness pins the reviewed commit, not a merge preview of it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read the Witness-regen trailer
        id: trailer
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$HEAD_SHA" ]; then
            echo "::error::checked out $actual, expected PR head $HEAD_SHA"
            echo "::error::the trailer would be read from the wrong commit message"
            exit 1
          fi
          body="$(git log -1 --pretty=%B)"
          echo "--- head commit $actual ---"; echo "$body"
          if reason="$(printf '%s\n' "$body" | sed -n 's/^Witness-regen:[[:space:]]*//p' | head -1)" && [ -n "$reason" ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "--- witness generation REQUESTED: $reason ---"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "--- no Witness-regen trailer; skipping generation ---"
          fi

      - uses: weldengine/setup-zig@v0.1.0
        if: steps.trailer.outputs.requested == 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
          # use-cache: false — the action caches .zig-cache itself; this workflow owns it
          use-cache: false

      - name: Generate one witness set per (precision, mode)
        if: steps.trailer.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for prec in false true; do
            for mode in Debug ReleaseSafe; do
              tag=$([ "$prec" = "true" ] && echo f64 || echo f32)
              dir="out/$tag-$mode"
              mkdir -p "$dir"
              echo "=== $tag / $mode ==="
              zig build forge-determinism \
                -Doptimize=$mode -Dphysics_f64=$prec -Dcpu=${{ env.ZIG_CPU }} \
                -- --write-witness "$dir"
            done
          done

      - name: Measure the cross-mode agreement and assemble the set
        if: steps.trailer.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p witnesses
          agree=true
          for tag in f32 f64; do
            for kind in discrete reference-window; do
              a="out/$tag-Debug/$kind-$tag.bin"
              b="out/$tag-ReleaseSafe/$kind-$tag.bin"
              if cmp -s "$a" "$b"; then
                echo "$kind-$tag.bin: Debug == ReleaseSafe"
              else
                agree=false
                echo "::warning::$kind-$tag.bin DIFFERS between Debug and ReleaseSafe."
                echo "::warning::Its witness key carries precision only, so the two keys are wrong."
                echo "::warning::This is a STOP and a design question, not a level-1 failure:"
                echo "::warning::C1.1 level 1 holds at identical BUILD, and these are two builds."
              fi
              cp "out/$tag-ReleaseSafe/$kind-$tag.bin" "witnesses/$kind-$tag.bin"
            done
            for mode in Debug ReleaseSafe; do
              cp "out/$tag-$mode/continuous-chain-$tag-$mode.bin" "witnesses/"
            done
          done
          echo "cross_mode_agreement=$agree"
          echo "--- witness set (reference window and discrete taken from ReleaseSafe) ---"
          ls -l witnesses/
          sha256sum witnesses/* | tee witnesses/SHA256SUMS.txt
          zig_reported="$(zig version)"
          echo "zig version reports: $zig_reported"
          {
            echo "reason=${{ steps.trailer.outputs.reason }}"
            echo "cell=ubuntu-24.04"
            echo "cpu=${{ env.ZIG_CPU }}"
            echo "zig_requested=${{ env.ZIG_VERSION }}"
            echo "zig_version_output=$zig_reported"
            echo "reference_window_mode=ReleaseSafe"
            echo "discrete_mode=ReleaseSafe"
            echo "cross_mode_agreement=$agree"
            # The PR HEAD sha, never `github.sha` — on a `pull_request` event the
            # latter is the ephemeral merge commit, which is outside the branch
            # history and unresolvable by any later reader.
            echo "sha=${{ github.event.pull_request.head.sha }}"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "---"
            for f in witnesses/*.bin; do
              base="$(basename "$f")"
              case "$base" in
                continuous-chain-*-Debug.bin)       gen=Debug ;;
                continuous-chain-*-ReleaseSafe.bin) gen=ReleaseSafe ;;
                *)                                  gen=ReleaseSafe ;;
              esac
              echo "witness=$base mode=$gen zig=$zig_reported cpu=${{ env.ZIG_CPU }} run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            done
          } > witnesses/PROVENANCE.txt
          cat witnesses/PROVENANCE.txt

      - name: Upload the witness set
        if: steps.trailer.outputs.requested == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: determinism-witnesses
          path: witnesses/
          retention-days: 90

      - name: Upload the raw per-mode outputs
        if: steps.trailer.outputs.requested == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: determinism-raw-per-mode
          path: out/
          retention-days: 90

  # THE single required check. Branch protection requires this job and no other
  # (Guy applies the repository settings), and it aggregates the heavy jobs:
  # green when each is success OR skipped, red when any is failure or cancelled.
  # A doc-only pull request therefore merges in seconds, while one carrying code
  # stays gated on the whole matrix and both smokes.
  #
  # `skipped` counts as green because `changes` skips only a tree whose code was
  # already verified green (tools/ci_verdict).
  ci-gate:
    needs: [changes, build-and-test, runtime-smoke-test, vertical-slice-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate required results
        shell: bash
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          bt="${{ needs.build-and-test.result }}"
          rst="${{ needs.runtime-smoke-test.result }}"
          vss="${{ needs.vertical-slice-smoke.result }}"
          echo "changes=$changes build-and-test=$bt runtime-smoke-test=$rst vertical-slice-smoke=$vss"
          echo "::notice::$REASON"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed ($changes)"; exit 1
          fi
          for r in "$bt" "$rst" "$vss"; do
            case "$r" in
              success|skipped) : ;;
              *) echo "::error::a required upstream job is $r"; exit 1 ;;
            esac
          done
          echo "ci-gate: all clear."
