name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth for the toolchain version. Used by setup-zig AND
  # baked into the Zig build-cache key below — a toolchain bump rotates the
  # cache automatically. The build.zig minor-version guard still enforces the
  # 0.16.x invariant on the local toolchain.
  ZIG_VERSION: "0.16.0"

jobs:
  # M1.0.3-followup — doc-only fast path. `ci-gate` (en fin de fichier) devient
  # l'unique check required de la branch protection, en remplacement des 4
  # cellules build-and-test ; les jobs lourds sont conditionnés à la présence
  # d'un changement non-doc. `code` est true SAUF si tous les fichiers changés
  # matchent l'allowlist docs (**.md, briefs/**, docs/**, LICENSE, .gitignore).
  # Step bash plutôt que dorny/paths-filter : pas de dépendance d'action hors
  # whitelist (engine-development-workflow.md §7.3).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect non-doc changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # Base inconnue / zéro-SHA (premier push, force-push, shallow) -> CI
          # complet : on ne skippe jamais dans le doute.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "base unknown -> code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" "$head")"
          echo "--- changed files ---"; echo "$files"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|briefs/*|docs/*|LICENSE|.gitignore) : ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "--- verdict: code=$code ---"

  # M0.9 / E1 — test-category matrix. The 4 cells carry stable, nominative
  # check names that branch protection requires by name (Guy applies the
  # repo settings — out of Claude Code's hands):
  #   - build-and-test (ubuntu-24.04, Debug)
  #   - build-and-test (ubuntu-24.04, ReleaseSafe)
  #   - build-and-test (windows-2025, Debug)
  #   - build-and-test (windows-2025, ReleaseSafe)
  # Required-by-name closes the M0.8 post-mortem gap where a leg cancelled by
  # timeout (neutral state) was not blocking the merge: a required check that
  # is neutral/cancelled is NOT "success", so the merge is blocked.
  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        mode: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    # M0.1 hotfix — bumped from 10 to 20 min: Windows ReleaseSafe on the
    # 2-vCPU runner spends ~3 min on `zig build` then ~7 min on
    # `zig build test`, totalling ~10 min and tripping the 10-min budget
    # right at the edge. The +10 min headroom absorbs growth from
    # additional M0.x test specs without surprise CI failures. Proper
    # CI restructuring (job split / bench separation / Windows cache
    # investigation) is queued for M0.2 — cf. brief journal entry
    # 2026-05-21 18:00 "CI debt to investigate seriously in M0.2".
    # M0.8 close — ReleaseSafe budget raised to 40 min: the M0.8 suite
    # added the 01-85 differential corpus (program 84 cooks a 1132-line
    # file through Sema + build-obj in ReleaseSafe), the 50-pass ref500
    # parse bench, and the 81-block EBNF harness; both ReleaseSafe legs
    # now exceed the 20-min budget set at M0.1 (Debug still fits). The
    # proper CI restructuring (job split / bench separation / caching)
    # remains queued and is tracked at the M0.8 close.
    # M0.9 / E1 — the CI restructuring above is now delivered: bench split
    # to bench.yml, Zig build cache added below. The 40/20 min budgets are
    # kept as cold-cache headroom — a cache miss (zon change / eviction)
    # still pays the full build cost; warm runs land well under budget.
    # CI cache refresh chore — ReleaseSafe budget raised to 55 min: the M0.9
    # cache key had no per-commit component and the monolithic action never
    # re-saved on an exact-key hit, so the cache fossilized at its first save
    # while the M1.0.x milestones drifted the sources; the near-cold
    # windows-2025 ReleaseSafe recompile now exceeds 40 min. The restore/save
    # split below fixes the refresh mechanism; 55 min covers the residual
    # near-cold case on the slowest runner (Debug still fits in 20).
    timeout-minutes: ${{ matrix.mode == 'ReleaseSafe' && 55 || 20 }}
    steps:
      - uses: actions/checkout@v6

      # Action versions pinned to the engine-development-workflow.md §7.3
      # whitelist (M0.9 / E1 decision): weldengine/setup-zig@v0.1.0 (exact
      # tag, not a floating @v0 — manual bumps), actions/cache@v5,
      # actions/upload-artifact@v6, actions/checkout@v6. All Node 24 /
      # runner ≥ 2.327.1.
      # Brief specifies `version: 0.16.x` for patch fluidity, but the
      # setup-zig action takes that syntax literally and resolves to
      # zig-...-0.16.x.tar.xz on the mirrors (404 everywhere). Pinned to
      # 0.16.0 exact until the action supports semver ranges or we switch
      # to `version-file: build.zig.zon`. Tracked as an acted deviation in
      # briefs/S0-bootstrap.md. The build.zig minor-version guard still
      # enforces the 0.16.x invariant on the local toolchain.
      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}

      # M0.9 / E1, reworked by the CI cache refresh chore — Zig build cache
      # keyed on (os, optimize mode, zig version, build.zig.zon hash), now as
      # an explicit restore/save split with a per-sha primary key. The
      # monolithic actions/cache@v5 step never re-saved on an exact-key hit,
      # so under a stable build.zig.zon the cache froze at its first save (a
      # fossil) while every milestone drifted the sources further from it —
      # until the windows-2025 ReleaseSafe recompile blew the job budget. The
      # per-sha primary key never exact-hits on a fresh commit, so every run
      # re-saves from the most recent prior state; GitHub's 10 GB per-repo
      # LRU retires old entries (no manual cleanup machinery).
      # Three-level fallback: exact sha -> newest cache under this zon
      # (prefix-matches both the post-build and post-test saves below,
      # newest first) -> newest cache under this os/mode/zig. The local
      # `.zig-cache` holds the mode-specific incremental compilation outputs
      # that dominate CI wall-time on the ReleaseSafe legs — hence the key
      # includes `matrix.mode`. Zig's cache is content-hashed and
      # self-invalidating: a restored cache never yields a stale build.
      # setup-zig's own (global) cache is left at its default — this step
      # adds the mode-keyed local cache it does not cover.
      # §7.3 whitelist note: actions/cache/restore@v5 and actions/cache/save@v5
      # are sub-actions of the already-whitelisted actions/cache@v5 (same
      # repo, same major, same portability notes).
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: zig-${{ matrix.os }}-${{ matrix.mode }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ matrix.os }}-${{ matrix.mode }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-
            zig-${{ matrix.os }}-${{ matrix.mode }}-${{ env.ZIG_VERSION }}-

      - name: zig fmt --check
        run: zig fmt --check src tests build.zig

      # M0.9 / E1 — `zig build` and `zig build test` are timed individually
      # (bash $SECONDS) and the elapsed values handed to the timing report
      # step via $GITHUB_ENV. Combined with the matched restore key recorded
      # below, the archived artifact lets the cache behaviour be validated
      # by measurement (which fallback level seeded the run, and what the
      # build/test wall-times were under it), not presumed.
      - name: zig build
        shell: bash
        run: |
          set -euo pipefail
          s=$SECONDS
          zig build -Doptimize=${{ matrix.mode }}
          echo "BUILD_SECONDS=$((SECONDS - s))" >> "$GITHUB_ENV"

      # CI cache refresh chore — mid-job save right after `zig build`: a run
      # killed during `zig build test` (timeout, crash, runner loss) still
      # leaves a fresh build cache, bounding the damage of any test-step
      # death to one build's worth of recompilation. The monolithic action's
      # post-job save was skipped on timeout cancellation, which is what
      # locked the fossil death loop. The `-build` suffix keeps this entry
      # distinct from the full post-test save at the end of the job; the
      # zon-level prefix fallback of the restore step matches both, newest
      # first.
      - name: Save Zig cache (post-build)
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: zig-${{ matrix.os }}-${{ matrix.mode }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}-build

      - name: zig build test
        shell: bash
        run: |
          set -euo pipefail
          s=$SECONDS
          zig build test -Doptimize=${{ matrix.mode }}
          echo "TEST_SECONDS=$((SECONDS - s))" >> "$GITHUB_ENV"

      # M0.2 / E5 — bindgen-verify gate. Regenerates the Vulkan +
      # Wayland bindings and asserts `git diff --quiet` on
      # `bindings/generated/` + `src/core/platform/`. Any drift
      # between the committed bindings and what the regen produces
      # blocks the merge.
      - name: zig build bindgen-verify
        run: zig build bindgen-verify

      # M0.8 / E3-D — D-S5-synth100-proper proof: the standalone
      # bench/fixtures/synth_100/ sub-project resolves the parent as a
      # path dependency, cooks the committed 100-file corpus through the
      # installed etch_cook artifact, and compiles it against weld_core.
      # A nested cold build (~30 s) — one matrix leg is enough.
      - name: zig build verify-synth-100
        if: matrix.os == 'ubuntu-24.04' && matrix.mode == 'Debug'
        run: zig build verify-synth-100

      # M0.9 / E1 — CI wall-time + cache measurement, archived as an
      # artifact (measurement deliverable, not a gate). `always()` so a
      # failing build/test leg still publishes whatever it measured.
      # With the restore/save split, `cache-hit` is true only on an exact
      # primary-key hit — per-sha, effectively never — so the diagnostic
      # signal is `cache_matched_key`: which fallback level actually seeded
      # the run ('none' = fully cold).
      - name: Write CI timing report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="ci-timing-${{ matrix.os }}-${{ matrix.mode }}.txt"
          {
            echo "cell=build-and-test (${{ matrix.os }}, ${{ matrix.mode }})"
            echo "os=${{ matrix.os }}"
            echo "mode=${{ matrix.mode }}"
            echo "zig_version=${{ env.ZIG_VERSION }}"
            echo "cache_key=zig-${{ matrix.os }}-${{ matrix.mode }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}"
            echo "cache_hit=${{ steps.zig-cache.outputs.cache-hit || 'false' }}"
            echo "cache_matched_key=${{ steps.zig-cache.outputs.cache-matched-key || 'none' }}"
            echo "build_seconds=${BUILD_SECONDS:-NA}"
            echo "test_seconds=${TEST_SECONDS:-NA}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "sha=${{ github.sha }}"
          } > "$report"
          cat "$report"

      - name: Upload CI timing artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-${{ matrix.os }}-${{ matrix.mode }}
          path: ci-timing-${{ matrix.os }}-${{ matrix.mode }}.txt
          retention-days: 30

      # CI cache refresh chore — full post-test cache save. `if: always()`
      # so a red test leg still saves whatever it compiled. This entry is
      # newer than the post-build save of the same run, so the zon-level
      # prefix fallback serves it first to the next run.
      - name: Save Zig cache (final)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: zig-${{ matrix.os }}-${{ matrix.mode }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}

  runtime-smoke-test:
    # M0.4 § Scope Post-Review — first application of the runtime
    # semantic CI rule (cf. engine-development-workflow.md §4.5.1).
    # Linux-only: weston + lavapipe provide a fully software path that
    # exercises Vulkan init + Wayland surface + render pass + present +
    # copyTextureToBuffer end-to-end. Windows CI sits behind manual
    # GPU §4.5.1 validation since the runners do not ship a Vulkan
    # software driver.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, build-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}

      # M0.9 / E1 — same Zig build cache as build-and-test. This job
      # `needs: build-and-test`, so the ubuntu-24.04/ReleaseSafe cell has
      # already saved its cache by the time this job starts; the matching
      # key warms this ReleaseSafe build even on the first push.
      - name: Restore Zig cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: zig-ubuntu-24.04-ReleaseSafe-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-ubuntu-24.04-ReleaseSafe-${{ env.ZIG_VERSION }}-

      - name: Install weston + Mesa Vulkan software drivers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston \
            mesa-vulkan-drivers \
            libvulkan1 \
            libwayland-client0 \
            libwayland-cursor0

      - name: Locate lavapipe ICD on the runner
        # Diagnostic step — does not fail the job. The previous run showed
        # `createInstance failed: IncompatibleDriver`, which means
        # `VK_ICD_FILENAMES` was pointing at a path the runner does not
        # actually have. This step prints every candidate location so the
        # follow-up step's env var can be set to the real path.
        run: |
          set -euo pipefail
          echo "--- find /usr/share/vulkan ---"
          find /usr/share/vulkan -name "*lvp*" -o -name "*lavapipe*" 2>/dev/null || echo "no lavapipe ICD found"
          echo "--- ls /usr/share/vulkan/icd.d/ ---"
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || echo "no icd.d directory"
          echo "--- dpkg -L mesa-vulkan-drivers | grep icd ---"
          dpkg -L mesa-vulkan-drivers | grep -i icd 2>/dev/null || echo "no icd in mesa-vulkan-drivers"
          echo "--- vulkaninfo --summary (if available) ---"
          (command -v vulkaninfo >/dev/null && vulkaninfo --summary 2>&1 | head -40) || echo "vulkaninfo not installed"

      - name: zig build (ReleaseSafe)
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseSafe

      - name: Launch weston headless backend
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-dir
          chmod 700 /tmp/runtime-dir
          XDG_RUNTIME_DIR=/tmp/runtime-dir WAYLAND_DISPLAY=wayland-1 \
            weston --backend=headless --width=1280 --height=720 &
          # Give weston a beat to bind the wayland socket before the
          # example connects.
          sleep 2
          echo "WAYLAND_DISPLAY=wayland-1" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/tmp/runtime-dir" >> "$GITHUB_ENV"

      - name: zig build run-example-triangle (smoke + capture)
        env:
          # Force lavapipe (Mesa software Vulkan ICD) on the runner.
          # Path validated by the `Locate lavapipe ICD` diagnostic step
          # above — adjust here if the runner reports a different path.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -euo pipefail
          zig build run-example-triangle -- \
            --smoke-test --vulkan-driver=software --capture-frame=10

      - name: Verify PSNR vs golden
        run: |
          set -euo pipefail
          if [ ! -f tests/golden/smoke_test_software.ppm ]; then
            echo "Golden PPM not yet committed — capture written to out/smoke_test.ppm." >&2
            echo "First-run procedure: download out/smoke_test.ppm from this job, validate visually," >&2
            echo "commit it as tests/golden/smoke_test_software.ppm, then re-run." >&2
            exit 0
          fi
          # M0.5 item 1: direct PSNR comparison of the PPM already produced
          # by the previous step against the golden. `test-ppm-psnr` runs
          # ONLY tests/render/ppm_psnr_compare.zig, which imports just `std`
          # (no `weld_render`): it compiles in seconds and does NOT rebuild
          # the render stack or re-spawn the triangle (the prior step already
          # wrote out/smoke_test.ppm). Replaces the rebuild-heavy
          # `test-render-capture` invocation (~3-5 min/run). The test raises a
          # typed error when PSNR < 40 dB, so a non-zero exit propagates
          # through pipefail.
          zig build test-ppm-psnr -Doptimize=ReleaseSafe --summary all 2>&1 | tee test-output.txt

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-smoke-test-capture
          path: |
            out/smoke_test.ppm
            test-output.txt
          retention-days: 30

  vertical-slice-smoke:
    # M0.9 / E4 — vertical-slice render smoke. The slice's `--smoke-test` path
    # renders the live ECS scene OFFSCREEN (no window/swapchain) into an RGBA8
    # target via the full GAL forward path (depth, instancing, uniform +
    # sampled-texture bind groups, the `copyBufferToTexture` upload) and
    # captures a PPM. A Debug build turns on the GAL validation layers, so a
    # barrier/usage error surfaces in the log and fails the job. No weston
    # needed (offscreen — no Wayland surface). This asserts "the frame composes,
    # validation-clean"; visual correctness is hardware-validated.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, build-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Restore Zig cache (Debug)
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: zig-ubuntu-24.04-Debug-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-ubuntu-24.04-Debug-${{ env.ZIG_VERSION }}-

      - name: Install Mesa Vulkan (lavapipe) + validation layers + weston
        run: |
          set -euo pipefail
          sudo apt-get update
          # weston: only the vk_blit VUID observation (E6 input) needs a Wayland
          # surface; the slice smoke + C0.8 edit render offscreen (no surface).
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 weston
          # Ubuntu 24.04 names the Khronos validation layers package
          # `vulkan-validationlayers` (no hyphen); older naming used
          # `vulkan-validation-layers`. Try both — fail if neither installs
          # (validation MUST be active for this job to mean anything).
          sudo apt-get install -y --no-install-recommends vulkan-validationlayers \
            || sudo apt-get install -y --no-install-recommends vulkan-validation-layers
          # Guard: the smoke is only meaningful with the layer present. Fail
          # loudly rather than silently rendering without validation.
          ls /usr/share/vulkan/explicit_layer.d/ | grep -iq validation \
            || { echo "::error::Khronos validation layer manifest not found after install"; exit 1; }

      - name: Run vertical-slice smoke (Debug, validation layers active)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -euo pipefail
          mkdir -p out
          # Default `zig build` = Debug → render.zig enable_validation = true →
          # the validation layers load. Offscreen render → no surface/weston.
          zig build run-vertical-slice -- --smoke-test --capture out/vertical_slice.ppm 2>&1 | tee slice-smoke.log
          echo "--- a frame was composed + captured ---"
          test -s out/vertical_slice.ppm
          echo "--- validation-clean (no Vulkan VUID / Validation Error) ---"
          if grep -E "VUID-|Validation Error" slice-smoke.log; then
            echo "::error::Vulkan validation error during the vertical-slice smoke (see log above)"
            exit 1
          fi
          echo "vertical-slice smoke OK: frame composed, validation clean."

      - name: Run vertical-slice C0.8 IPC edit (Debug, validation layers active)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -euo pipefail
          mkdir -p out
          # E5 / C0.8 end-to-end: an editor-stub thread sends a real
          # ModifyComponent over the M0.7 transport; the slice applies it to the
          # live World; the render reflects it. Offscreen capture, validation on.
          zig build run-vertical-slice -- --ipc-edit --capture out/vertical_slice_ipc.ppm 2>&1 | tee slice-c08.log
          echo "--- the post-edit frame composed + captured ---"
          test -s out/vertical_slice_ipc.ppm
          if grep -E "VUID-|Validation Error" slice-c08.log; then
            echo "::error::Vulkan validation error during the C0.8 IPC edit (see log above)"
            exit 1
          fi
          echo "vertical-slice C0.8 OK: IPC edit -> live world -> frame composed, validation clean."

      - name: Assert vk_blit GAL blit is validation-clean (E6 — colorspace VUID absent)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          # Sync validation on so the present-semaphore reuse
          # (VUID-vkQueueSubmit-pSignalSemaphores-00067) would surface if present.
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          set -uo pipefail
          mkdir -p /tmp/weld-rt && chmod 700 /tmp/weld-rt
          XDG_RUNTIME_DIR=/tmp/weld-rt weston --backend=headless --width=1280 --height=720 &
          sleep 2
          export XDG_RUNTIME_DIR=/tmp/weld-rt WAYLAND_DISPLAY=wayland-1
          # The editor blits the runtime mire via the E6-consolidated
          # src/editor/vk_blit.zig (now on the GAL); Debug build → GAL
          # validation layer + syncval feature.
          zig build run-ipc-demo -- --frames=120 > vkblit.log 2>&1 || true
          echo "=== vk_blit GAL blit on lavapipe (E6) ==="
          echo "--- distinct VUIDs ---"
          grep -oE "VUID-[A-Za-z0-9-]+" vkblit.log | sort -u || echo "  (none)"
          echo "--- (a) colorspace — MUST be absent (E6 fix) ---"
          if grep -iE "imageColorSpace|color.?space|VUID-VkSwapchainCreateInfoKHR-imageColorSpace" vkblit.log; then
            echo "::error::E6 regression — vk_blit swapchain colorspace VUID still fires (bug (a) not resorbed)"
            exit 1
          fi
          echo "  absent — bug (a) resorbed."
          echo "--- sync-validation WRITE_AFTER_READ hazard — MUST be absent (render-pass external dependency) ---"
          if grep -E "SYNC-HAZARD" vkblit.log; then
            echo "::error::E6 regression — render-pass/acquire SYNC-HAZARD fires (GAL render-pass external subpass dependency missing)"
            exit 1
          fi
          echo "  absent — the GAL render-pass external subpass dependency holds under syncval."
          echo "--- (b) present-semaphore reuse (VUID-...-00067) — hardware-only, observed only ---"
          # NON-failing: software present on lavapipe is synchronous, so 00067
          # does not surface here; the per-image-semaphore fix is verified by
          # construction + hardware (no false green from a lavapipe pass).
          grep -E "00067|pSignalSemaphores" vkblit.log || echo "  not observed on lavapipe (expected — hardware-only)"
          echo "=== end E6 blit validation ==="

      - name: Upload slice capture
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vertical-slice-smoke-capture
          path: |
            out/vertical_slice.ppm
            out/vertical_slice_ipc.ppm
            slice-smoke.log
            slice-c08.log
            vkblit.log
          retention-days: 30

  # M1.0.3-followup — l'UNIQUE check required. La branch protection ne requiert
  # que ce job (Guy applique les réglages repo). Il agrège les jobs lourds :
  # vert si tous success OU skipped (PR doc-only), rouge si l'un est failure /
  # cancelled. Une PR doc-only merge en secondes ; une PR code reste gatée sur
  # toute la matrice + les smokes.
  ci-gate:
    needs: [changes, build-and-test, runtime-smoke-test, vertical-slice-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate required results
        shell: bash
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          bt="${{ needs.build-and-test.result }}"
          rst="${{ needs.runtime-smoke-test.result }}"
          vss="${{ needs.vertical-slice-smoke.result }}"
          echo "changes=$changes build-and-test=$bt runtime-smoke-test=$rst vertical-slice-smoke=$vss"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed ($changes)"; exit 1
          fi
          for r in "$bt" "$rst" "$vss"; do
            case "$r" in
              success|skipped) : ;;
              *) echo "::error::a required upstream job is $r"; exit 1 ;;
            esac
          done
          echo "ci-gate: all clear."
