name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        mode: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    # M0.1 hotfix — bumped from 10 to 20 min: Windows ReleaseSafe on the
    # 2-vCPU runner spends ~3 min on `zig build` then ~7 min on
    # `zig build test`, totalling ~10 min and tripping the 10-min budget
    # right at the edge. The +10 min headroom absorbs growth from
    # additional M0.x test specs without surprise CI failures. Proper
    # CI restructuring (job split / bench separation / Windows cache
    # investigation) is queued for M0.2 — cf. brief journal entry
    # 2026-05-21 18:00 « Dette CI à instruire sérieusement en M0.2 ».
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Brief specifies `version: 0.16.x` for patch fluidity. As of v2 of
      # this action, that syntax is taken literally and resolves to
      # zig-...-0.16.x.tar.xz on the mirrors (404 everywhere). Pinned to
      # 0.16.0 exact until the action supports semver ranges or we switch
      # to `version-file: build.zig.zon`. Tracked as an acted deviation in
      # briefs/S0-bootstrap.md. The build.zig minor-version guard still
      # enforces the 0.16.x invariant on the local toolchain.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig fmt --check
        run: zig fmt --check src tests build.zig

      - name: zig build
        run: zig build -Doptimize=${{ matrix.mode }}

      - name: zig build test
        run: zig build test -Doptimize=${{ matrix.mode }}

  bench-ecs-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Compile-and-run sanity for the S1 ECS bench. The full bench gate
      # (≤ 1.0 ms median ReleaseSafe on the M4 Pro reference) is checked
      # locally on Guy's machine, not in CI — see briefs/S1-mini-ecs.md.
      - name: zig build bench-ecs -- --smoke
        run: zig build bench-ecs -Doptimize=ReleaseSafe -- --smoke
