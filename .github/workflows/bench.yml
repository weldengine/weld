name: Bench


on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'briefs/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'briefs/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth for the toolchain version — also keys the Zig
  # build cache below (cf. ci.yml).
  ZIG_VERSION: "0.16.0"
  # The third pinning axis of `ARCH-031` rule 6, same constant and same motive
  # as ci.yml's: no cell of this repository's CI compiles for its native CPU,
  # so that a runner image moving to a new processor generation cannot change
  # what is built without a line of code changing. A benchmark has the same
  # exposure as a test cell and one more reason to care — an unpinned number is
  # not comparable to the one the previous runner image produced.
  ZIG_CPU: "baseline"

jobs:
  bench-ecs-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Pinned to 0.16.0 exact — the action takes `0.16.x` literally and
      # 404s on the mirrors. Same rationale as ci.yml.
      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}
          # use-cache: false — the action caches .zig-cache itself; this workflow owns it
          use-cache: false

      # Keyed on every axis that changes what is built: os, optimize mode, CPU
      # feature set, zig version, and the zon hash. A key missing an axis the
      # build varies lets one half of that axis restore the other's archive:
      # Zig's manifests are cpu-aware, so the restore does not return a wrong
      # object — it returns a MISS, rebuilds, and leaves BOTH variants in one
      # `.zig-cache`, which is bloat rather than an error and therefore silent.
      #
      # This lineage is its OWN. It does not share with ci.yml, whose keys carry
      # a precision axis and a per-commit component this workflow has no use
      # for; a comment here claimed that sharing until the two shapes diverged,
      # and a claim about another file is exactly what goes stale unread.
      # The Zig cache is content-hashed and self-invalidating, so a restored
      # cache never produces a stale build.
      - name: Restore Zig cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: zig-v2-${{ matrix.os }}-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-v2-${{ matrix.os }}-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-

      - name: zig build bench-ecs -- --smoke
        run: zig build bench-ecs -Doptimize=ReleaseSafe -Dcpu=${{ env.ZIG_CPU }} -- --smoke

      # No pass threshold here, permanently: engine-ecs-internals.md §2 refuses to
      # engrave a crossover threshold and names this bench as what produces one, so
      # its output is the deliverable and a red means the bench crashed.
      - name: zig build bench-ecs-hybrid (crossover sweep)
        run: zig build bench-ecs-hybrid -Doptimize=ReleaseSafe -Dcpu=${{ env.ZIG_CPU }}

      - name: Archive the crossover measurement
        uses: actions/upload-artifact@v6
        with:
          name: ecs-hybrid-crossover-${{ matrix.os }}
          path: bench/results/ecs_hybrid_crossover.md
          if-no-files-found: error
          retention-days: 90
