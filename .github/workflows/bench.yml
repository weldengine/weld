name: Bench


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  ZIG_CPU: "baseline"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Decide whether this tree needs a run
        id: detect
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zig run tools/ci_verdict/main.zig -- decide --event "$EVENT" --base "$BASE" --head "$HEAD" \
            --tested HEAD --repo "${{ github.repository }}" --check bench-gate >> "$GITHUB_OUTPUT"

  bench-ecs-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Pinned to 0.16.0 exact — the action takes `0.16.x` literally and
      # 404s on the mirrors. Same rationale as ci.yml.
      - uses: weldengine/setup-zig@v0.1.0
        with:
          version: ${{ env.ZIG_VERSION }}
          # use-cache: false — the action caches .zig-cache itself; this workflow owns it
          use-cache: false

      - name: Restore Zig cache
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: zig-v2-${{ github.job }}-${{ matrix.os }}-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ github.job }}-${{ matrix.os }}-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-

      - name: zig build bench-ecs -- --smoke
        run: zig build bench-ecs -Doptimize=ReleaseSafe -Dcpu=${{ env.ZIG_CPU }} -- --smoke

      # No pass threshold here, permanently: engine-ecs-internals.md §2 refuses to
      # engrave a crossover threshold and names this bench as what produces one, so
      # its output is the deliverable and a red means the bench crashed.
      - name: zig build bench-ecs-hybrid (crossover sweep)
        run: zig build bench-ecs-hybrid -Doptimize=ReleaseSafe -Dcpu=${{ env.ZIG_CPU }}

      - name: Save Zig cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: zig-v2-${{ github.job }}-${{ matrix.os }}-ReleaseSafe-${{ env.ZIG_CPU }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}

      - name: Archive the crossover measurement
        uses: actions/upload-artifact@v6
        with:
          name: ecs-hybrid-crossover-${{ matrix.os }}
          path: bench/results/ecs_hybrid_crossover.md
          if-no-files-found: error
          retention-days: 90

  # The verdict `changes` inherits: green when the bench ran green or was skipped
  # because the same code already was.
  bench-gate:
    needs: [changes, bench-ecs-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate the bench results
        shell: bash
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          bench="${{ needs.bench-ecs-smoke.result }}"
          echo "changes=$changes bench-ecs-smoke=$bench"
          echo "::notice::$REASON"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed ($changes)"; exit 1
          fi
          case "$bench" in
            success|skipped) : ;;
            *) echo "::error::bench-ecs-smoke is $bench"; exit 1 ;;
          esac
